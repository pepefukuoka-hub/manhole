<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="マンホール巡り">
<meta name="theme-color" content="#23272b">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<title>マンホール巡り</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  /* 鋳鉄のくすみ + 路面の白線の黄色。地図と一覧を縦に積む、片手操作のナビ */
  :root {
    --bg: #f2f1ee;
    --surface: #ffffff;
    --fg: #1f2326;
    --muted: #6a7075;
    --line: #d9d7d2;
    --accent: #c58a00;
    --accent-fg: #1a1400;
    --ok: #2f7d4f;
    --pin: #c58a00;
    --pin-done: #2f7d4f;
    --me: #2b6cdf;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #181b1e; --surface: #23272b; --fg: #eceae5; --muted: #9aa0a5;
      --line: #353a3f; --accent: #e8b83a; --accent-fg: #1a1400;
      --ok: #5cc088; --pin: #e8b83a; --pin-done: #5cc088; --me: #6ea2ff;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #181b1e; --surface: #23272b; --fg: #eceae5; --muted: #9aa0a5;
    --line: #353a3f; --accent: #e8b83a; --accent-fg: #1a1400;
    --ok: #5cc088; --pin: #e8b83a; --pin-done: #5cc088; --me: #6ea2ff;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 15px/1.5 -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; gap: 12px;
  }
  header { display: flex; align-items: baseline; justify-content: space-between; padding-top: 8px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: .04em; }
  .count { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

  #nearest {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; display: flex; align-items: center; gap: 14px; min-height: 76px;
  }
  #arrow { width: 52px; height: 52px; flex: none; display: grid; place-items: center; }
  #arrow svg { width: 44px; height: 44px; transition: transform .3s; }
  #nearest .info { min-width: 0; flex: 1; }
  #nearest .label { font-size: 12px; color: var(--muted); letter-spacing: .06em; }
  #nearest .name { font-size: 17px; font-weight: 600; overflow-wrap: anywhere; }
  #nearest .dist { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }

  #map { height: 38vh; min-height: 220px; border-radius: 10px; border: 1px solid var(--line); z-index: 0; flex: none; }

  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    font: inherit; border: 1px solid var(--line); background: var(--surface); color: var(--fg);
    border-radius: 8px; padding: 10px 14px; min-height: 44px; cursor: pointer;
  }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 700; flex: 1; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--me); outline-offset: 2px; }

  .chip { border-radius: 999px; padding: 6px 14px; min-height: 36px; font-size: 14px; }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 700; }
  #q { flex: 1; min-width: 0; }

  #list { display: flex; flex-direction: column; gap: 8px; padding: 0; margin: 0; list-style: none; }
  #list li {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px;
  }
  #list li.inroute { border-color: var(--accent); }
  #list .t { font-weight: 600; overflow-wrap: anywhere; }
  #list .t.done { color: var(--ok); }
  #list .d { font-variant-numeric: tabular-nums; color: var(--muted); text-align: right; }
  #list .memo { grid-column: 1 / -1; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  #list .acts { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; }
  #list .acts button { padding: 6px 12px; min-height: 36px; font-size: 14px; }
  #list .acts button.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 700; }
  .empty { color: var(--muted); text-align: center; padding: 20px 8px; }

  #sheet, #sheet2, #sheet3 {
    position: fixed; inset: 0; background: rgba(0,0,0,.5); display: grid; align-items: end; z-index: 1000;
  }
  #sheet form, #sheet2 form, #sheet3 form {
    background: var(--surface); border-radius: 16px 16px 0 0; padding: 16px 16px max(16px, env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; gap: 10px; max-width: 560px; width: 100%; margin: 0 auto;
  }
  #sheet h2, #sheet2 h2, #sheet3 h2 { margin: 0; font-size: 17px; }
  input[type=text], input[type=search], textarea {
    font: inherit; width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--fg);
  }
  .pos { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .help { font-size: 13px; color: var(--muted); margin: 0; }
  #msg { color: var(--muted); font-size: 13px; min-height: 1.2em; }

  /* マンホールの蓋に見立てたピン。中の丸が点滅する */
  .pin { position: relative; width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--pin); background: var(--surface); }
  .pin::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--pin); animation: blink 1.6s ease-in-out infinite; }
  .pin.done { border-color: var(--pin-done); }
  .pin.done::after { background: var(--pin-done); }
  .pin.route { box-shadow: 0 0 0 3px var(--me); }
  .pin.est { border-style: dashed; }
  .pin.fresh { animation: ring 1s ease-out 6; }
  .pin.fresh::after { animation: blink .5s ease-in-out infinite; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .1; } }
  @keyframes ring { 0% { box-shadow: 0 0 0 0 var(--pin-done); } 100% { box-shadow: 0 0 0 22px transparent; } }
  .me { width: 16px; height: 16px; border-radius: 50%; background: var(--me); border: 3px solid #fff; box-shadow: 0 0 0 2px var(--me); }

  #arrive {
    position: fixed; left: 0; right: 0; top: env(safe-area-inset-top, 0px); z-index: 2000;
    padding: 12px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px));
    background: var(--ok); color: #fff; display: flex; flex-direction: column; gap: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,.35);
  }
  #arrive .big { font-size: 22px; font-weight: 800; }
  #arrive .sub { font-size: 15px; overflow-wrap: anywhere; }
  #arrive button { background: #fff; color: #14301f; border-color: #fff; font-weight: 700; flex: 1; }
  @media (prefers-reduced-motion: reduce) {
    #arrow svg { transition: none; }
    .pin::after, .pin.fresh, .pin.fresh::after { animation: none; }
  }
</style>
</head>
<body>
<div id="arrive" role="alert" hidden>
  <div class="big">到着しました</div>
  <div class="sub" id="arriveName"></div>
  <div class="row">
    <button id="arriveDone">訪問済みにする</button>
    <button id="arriveClose">閉じる</button>
  </div>
</div>
<header>
  <h1>マンホール巡り</h1>
  <span class="count" id="count"></span>
</header>

<section id="nearest" aria-live="polite">
  <div id="arrow" aria-hidden="true">
    <svg viewBox="0 0 48 48" id="arrowSvg"><circle cx="24" cy="24" r="22" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M24 7 L33 30 L24 25 L15 30 Z" fill="var(--accent)"/></svg>
  </div>
  <div class="info">
    <div class="label" id="nLabel">いちばん近い未訪問</div>
    <div class="name" id="nName">現在地を取得中…</div>
    <div class="dist" id="nDist"></div>
  </div>
</section>

<div id="map" role="application" aria-label="地図"></div>

<div class="row">
  <button class="primary" id="addBtn">いまここを登録</button>
  <button id="locBtn">現在地へ</button>
</div>
<div id="msg"></div>

<div class="row" role="group" aria-label="表示の切り替え">
  <button class="chip" id="fAll" aria-pressed="true">すべて</button>
  <button class="chip" id="fRoute" aria-pressed="false">今日のルート</button>
  <input type="search" id="q" placeholder="番号で探す(例: MC-07)" autocomplete="off" aria-label="番号で探す">
</div>
<div class="help" id="alignInfo"></div>
<div class="row" id="settings">
  <label for="arriveSel" class="help">到着を知らせる距離</label>
  <select id="arriveSel" aria-label="到着を知らせる距離">
    <option value="5">5 m</option><option value="8">8 m</option><option value="10">10 m</option>
    <option value="15">15 m</option><option value="20">20 m</option>
  </select>
  <label for="who" class="help">担当(提出時に記録)</label>
  <input type="text" id="who" maxlength="20" autocomplete="off" placeholder="例: 岩下" style="max-width:160px">
</div>
<div class="row" id="bulkRow" hidden>
  <button id="addShown">表示中をすべて今日のルートへ</button>
  <button id="clearRoute">ルートを空にする</button>
</div>

<ul id="list"></ul>

<div class="row">
  <button id="offlineBtn">空港エリアの地図を保存(オフライン用)</button>
  <button id="pasteBtn">番号の一覧を貼り付けて追加</button>
  <button id="submitBtn">提出用に書き出し</button>
  <button id="exportBtn">バックアップを保存</button>
  <button id="importBtn">読み込み(バックアップ・共有位置)</button>
  <input type="file" id="importFile" accept="application/json" hidden>
</div>

<div id="sheet" hidden>
  <form id="form">
    <h2>マンホールを登録</h2>
    <label for="fName">名前(例:○○市 ポケモン)</label>
    <input type="text" id="fName" required maxlength="60" autocomplete="off">
    <label for="fMemo">メモ</label>
    <textarea id="fMemo" rows="2" maxlength="200"></textarea>
    <div class="pos" id="fPos"></div>
    <div class="row">
      <button type="button" id="cancelBtn">キャンセル</button>
      <button type="submit" class="primary">登録</button>
    </div>
  </form>
</div>

<div id="sheet2" hidden>
  <form id="form2">
    <h2>番号の一覧を追加</h2>
    <p class="help">1行に1件。「番号 日付」の形で貼り付けます(日付は省略できます)。先頭に「昼」「夜」があれば区分として記録します。位置は、そのマンホールの上で「ここで位置を登録」を押すと入ります。</p>
    <textarea id="bulk" rows="8" placeholder="昼 MA-1 4/27&#10;夜 MC-07-1 5/26"></textarea>
    <div class="row">
      <button type="button" id="cancel2">キャンセル</button>
      <button type="submit" class="primary">追加</button>
    </div>
  </form>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  const KEY = 'manhole.spots.v1';
  const $ = (id) => document.getElementById(id);
  let spots = load();
  let me = null;            // {lat, lng, acc}
  let heading = null;
  let map, meMarker, markers = {};
  let draft = null;
  let freshId = null;            // 登録直後のピン(中が速く点滅する)
  let arriveId = null;           // 到着の案内を出している地点
  const arrivalShown = new Set(); // 案内済みの地点(閉じたあと再表示しない)
  let ARRIVE_M = 10;   // 到着を知らせる距離(m)。GPSと登録位置の誤差を合わせて、10m前後が目安
  try { const v = parseInt(localStorage.getItem('manhole.arriveM'), 10); if (v >= 3 && v <= 50) ARRIVE_M = v; } catch (e) {}
  let filter = 'all';
  let lastRender = 0;
  let audio = null;

  const isNum = (v) => typeof v === 'number' && isFinite(v);
  const hasActual = (s) => isNum(s.lat) && isNum(s.lng);

  // 位置: 共有位置(全員の登録を集約したもの)があればそれ、なければ自分の登録
  function pos(s) {
    if (isNum(s.mlat) && isNum(s.mlng)) return { lat: s.mlat, lng: s.mlng, est: false, shared: true };
    if (hasActual(s)) return { lat: s.lat, lng: s.lng, est: false };
    return null;
  }
  const hasPos = (s) => !!pos(s);
  function sharedText() {
    const mine = spots.filter(hasActual).length, shared = spots.filter((s) => isNum(s.mlat)).length;
    return spots.length ? '自分の登録 ' + mine + ' 件' + (shared ? ' / 共有位置 ' + shared + ' 件' : '') : '';
  }

  function load() {
    try { const v = JSON.parse(localStorage.getItem(KEY) || '[]'); return Array.isArray(v) ? v : []; }
    catch (e) { return []; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(spots)); return true; }
    catch (e) { say('保存できませんでした。「バックアップを保存」を押してください。'); return false; }
  }
  function say(t) { $('msg').textContent = t; }
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  function dist(a, b) {
    const R = 6371000, r = Math.PI / 180;
    const dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
    const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(x));
  }
  function bearing(a, b) {
    const r = Math.PI / 180;
    const y = Math.sin((b.lng - a.lng) * r) * Math.cos(b.lat * r);
    const x = Math.cos(a.lat * r) * Math.sin(b.lat * r) - Math.sin(a.lat * r) * Math.cos(b.lat * r) * Math.cos((b.lng - a.lng) * r);
    return (Math.atan2(y, x) / r + 360) % 360;
  }
  const DIRS = ['北', '北東', '東', '南東', '南', '南西', '西', '北西'];
  const dirName = (deg) => DIRS[Math.round(deg / 45) % 8];
  function fmt(m) { return m < 1000 ? Math.round(m) + ' m' : (m / 1000).toFixed(1) + ' km'; }

  // 音: iPhoneのSafariは振動に対応していないため、到着は音と画面の帯で知らせる
  function unlockAudio() {
    if (audio) { if (audio.state === 'suspended') audio.resume(); return; }
    try { const C = window.AudioContext || window.webkitAudioContext; if (C) audio = new C(); } catch (e) {}
  }
  document.addEventListener('pointerdown', unlockAudio);
  function beep() {
    if (!audio) return;
    try {
      [0, 0.28].forEach((t) => {
        const o = audio.createOscillator(), g = audio.createGain();
        o.frequency.value = t ? 1175 : 880; o.type = 'sine';
        g.gain.setValueAtTime(0.0001, audio.currentTime + t);
        g.gain.exponentialRampToValueAtTime(0.4, audio.currentTime + t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + t + 0.22);
        o.connect(g); g.connect(audio.destination);
        o.start(audio.currentTime + t); o.stop(audio.currentTime + t + 0.25);
      });
    } catch (e) {}
  }

  function initMap() {
    map = L.map('map', { zoomControl: false }).setView([AIRPORT.lat, AIRPORT.lng], 16);
    const attr = '<a href="https://maps.gsi.go.jp/development/ichiran.html">地理院タイル</a>';
    const std = L.tileLayer(tileUrl('std', 'png'), { maxZoom: 19, maxNativeZoom: 18, attribution: attr }).addTo(map);
    const photo = L.tileLayer(tileUrl('seamlessphoto', 'jpg'), { maxZoom: 19, maxNativeZoom: 18, attribution: attr });
    L.control.layers({ '標準地図': std, '航空写真': photo }, null, { position: 'topleft' }).addTo(map);
    L.control.zoom({ position: 'topright' }).addTo(map);
  }

  // 岡山空港の敷地まわり(オフライン保存の範囲)
  const AIRPORT = { lat: 34.7569, lng: 133.8539 };
  const AREA = { s: 34.7481, w: 133.8386, n: 34.7662, e: 133.8725 };
  const ZOOMS = [15, 16, 17, 18];
  const LAYERS = [['std', 'png'], ['seamlessphoto', 'jpg']];
  function tileUrl(layer, ext) { return 'https://cyberjapandata.gsi.go.jp/xyz/' + layer + '/{z}/{x}/{y}.' + ext; }
  function tileXY(lat, lng, z) {
    const n = 2 ** z, r = Math.PI / 180;
    return { x: Math.floor((lng + 180) / 360 * n), y: Math.floor((1 - Math.log(Math.tan(lat * r) + 1 / Math.cos(lat * r)) / Math.PI) / 2 * n) };
  }
  function areaUrls() {
    const urls = [];
    LAYERS.forEach(([layer, ext]) => ZOOMS.forEach((z) => {
      const a = tileXY(AREA.n, AREA.w, z), b = tileXY(AREA.s, AREA.e, z);
      for (let x = a.x; x <= b.x; x++) for (let y = a.y; y <= b.y; y++) urls.push(tileUrl(layer, ext).replace('{z}', z).replace('{x}', x).replace('{y}', y));
    }));
    return urls;
  }
  let saving = false;
  async function saveOffline() {
    if (saving) return;
    if (!('caches' in window)) { say('この端末では地図を保存できません。'); return; }
    if (!navigator.onLine) { say('通信できる場所で押してください。'); return; }
    saving = true;
    const btn = $('offlineBtn');
    try {
      const cache = await caches.open('manhole-tiles-v1');
      const urls = areaUrls();
      let done = 0, fail = 0, i = 0;
      const tick = () => { btn.textContent = '保存中 ' + done + ' / ' + urls.length; };
      tick();
      const worker = async () => {
        while (i < urls.length) {
          const u = urls[i++];
          try {
            if (!(await cache.match(u))) {
              const res = await fetch(u, { mode: 'cors' });
              if (res.ok) await cache.put(u, res); else fail++;
            }
          } catch (e) { fail++; }
          done++;
          if (done % 10 === 0) tick();
        }
      };
      await Promise.all(Array.from({ length: 6 }, worker));
      try { localStorage.setItem('manhole.offlineSavedAt', String(Date.now())); } catch (e) {}
      say(fail ? '地図を保存しました(' + fail + ' 枚は取得できませんでした。もう一度押すと補えます)。' : '空港エリアの地図を保存しました。圏外でも表示されます。');
    } catch (e) {
      say('地図を保存できませんでした。空き容量を確認してください。');
    }
    btn.textContent = '空港エリアの地図を保存(オフライン用)';
    saving = false;
  }

  function renderMarkers() {
    Object.values(markers).forEach((m) => m.remove());
    markers = {};
    spots.forEach((s) => {
      const p = pos(s);
      if (!p) return;
      const cls = 'pin' + (s.visited ? ' done' : '') + (s.route ? ' route' : '') + (p.est ? ' est' : '') + (s.id === freshId ? ' fresh' : '');
      const icon = L.divIcon({ className: '', html: '<div class="' + cls + '"></div>', iconSize: [26, 26], iconAnchor: [13, 13] });
      markers[s.id] = L.marker([p.lat, p.lng], { icon, title: s.name }).addTo(map)
        .on('click', () => document.getElementById('s-' + s.id)?.scrollIntoView({ behavior: 'smooth', block: 'center' }));
    });
  }

  function shownSpots() {
    const q = $('q').value.trim().toLowerCase();
    return spots.filter((s) => (filter === 'all' || s.route) && (!q || (s.name + ' ' + (s.memo || '')).toLowerCase().includes(q)));
  }

  function pulseFresh(id) {
    freshId = id;
    setTimeout(() => { if (freshId === id) { freshId = null; renderMarkers(); } }, 6000);
  }

  function render() {
    lastRender = Date.now();
    $('alignInfo').textContent = sharedText();
    const done = spots.filter((s) => s.visited).length;
    const routeN = spots.filter((s) => s.route).length;
    $('count').textContent = spots.length ? done + ' / ' + spots.length + ' 訪問済み' : '';
    $('fRoute').textContent = '今日のルート' + (routeN ? '(' + routeN + ')' : '');
    $('fAll').setAttribute('aria-pressed', filter === 'all');
    $('fRoute').setAttribute('aria-pressed', filter === 'route');

    const list = $('list');
    list.textContent = '';
    const rows = shownSpots().map((s) => { const p = pos(s); return { s, p, d: me && p ? dist(me, p) : null }; });
    $('bulkRow').hidden = !(rows.length && (filter === 'route' ? true : $('q').value.trim())) && !routeN;
    if (!rows.length) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.style.display = 'block';
      li.textContent = !spots.length ? 'まだ登録がありません。マンホールの上で「いまここを登録」を押すか、番号の一覧を貼り付けてください。'
        : filter === 'route' ? '今日のルートが空です。「すべて」から、まわる地点の「ルートに入れる」を押してください。' : '見つかりません。';
      list.appendChild(li);
    }
    rows.sort((a, b) => (a.s.visited - b.s.visited) || ((a.d ?? 1e12) - (b.d ?? 1e12)) || a.s.name.localeCompare(b.s.name, 'ja', { numeric: true }));
    rows.forEach(({ s, p, d }) => {
      const li = document.createElement('li');
      li.id = 's-' + s.id;
      if (s.route) li.className = 'inroute';
      const t = document.createElement('div'); t.className = 't' + (s.visited ? ' done' : ''); t.textContent = (s.visited ? '✓ ' : '') + s.name;
      const dd = document.createElement('div'); dd.className = 'd';
      dd.textContent = !p ? '位置未登録' : d == null ? (p.est ? '推定' : '') : fmt(d) + ' ' + dirName(bearing(me, p)) + (p.est ? '(推定)' : '');
      li.append(t, dd);
      if (s.memo) { const m = document.createElement('div'); m.className = 'memo'; m.textContent = s.memo; li.appendChild(m); }
      const acts = document.createElement('div'); acts.className = 'acts';

      const rt = document.createElement('button'); rt.textContent = s.route ? 'ルートから外す' : 'ルートに入れる';
      if (s.route) rt.className = 'on';
      rt.onclick = () => { s.route = !s.route; save(); renderAll(); };

      if (p) {
        const nav = document.createElement('button'); nav.textContent = 'ナビ';
        nav.onclick = () => { window.open('https://maps.apple.com/?daddr=' + p.lat + ',' + p.lng + '&dirflg=w', '_blank'); };
        const go = document.createElement('button'); go.textContent = '地図で見る';
        go.onclick = () => { map.setView([p.lat, p.lng], 18); window.scrollTo({ top: 0, behavior: 'smooth' }); };
        acts.append(nav, go);
      }
      if (!hasActual(s)) {
        const fix = document.createElement('button'); fix.textContent = 'ここで位置を登録'; fix.className = 'on';
        fix.onclick = () => {
          if (!me) { say('現在地を取得してから押してください。'); return; }
          s.lat = me.lat; s.lng = me.lng; s.acc = me.acc; s.visited = true; s.at = Date.now();
          arrivalShown.add(s.id);
          save(); renderAll(); pulseFresh(s.id); renderMarkers();
          map.setView([s.lat, s.lng], Math.max(map.getZoom(), 18));
          window.scrollTo({ top: 0, behavior: 'smooth' });
          say(s.name + ' の位置を登録しました(この端末に保存済み)。');
        };
        acts.append(fix);
      }
      const vis = document.createElement('button'); vis.textContent = s.visited ? '未訪問に戻す' : '訪問済みにする';
      vis.onclick = () => { s.visited = !s.visited; s.at = s.visited ? Date.now() : null; save(); renderAll(); };
      const del = document.createElement('button'); del.textContent = '削除';
      del.onclick = () => {
        if (del.dataset.arm) { spots = spots.filter((x) => x.id !== s.id); save(); renderAll(); }
        else { del.dataset.arm = '1'; del.textContent = 'もう一度押すと削除'; setTimeout(() => { del.dataset.arm = ''; del.textContent = '削除'; }, 3000); }
      };
      acts.append(rt, vis, del);
      li.appendChild(acts);
      list.appendChild(li);
    });
    renderNearest();
  }

  function renderNearest() {
    const routeOn = spots.some((s) => s.route);
    const pool = spots.filter((s) => !s.visited && (!routeOn || s.route));
    $('nLabel').textContent = routeOn ? '今日のルートで次の地点' : 'いちばん近い未訪問';
    if (!me) { $('nName').textContent = '現在地を取得中…'; $('nDist').textContent = ''; return; }
    if (!pool.length) {
      $('nName').textContent = !spots.length ? 'マンホールを登録しましょう' : routeOn ? 'ルートを全部まわりました' : '全部まわりました';
      $('nDist').textContent = ''; return;
    }
    const located = pool.filter(hasPos);
    if (!located.length) { $('nName').textContent = '位置が未登録です。現地で「ここで位置を登録」を押してください'; $('nDist').textContent = ''; return; }
    let best = null, bd = Infinity, bp = null;
    located.forEach((s) => { const p = pos(s), d = dist(me, p); if (d < bd) { bd = d; best = s; bp = p; } });
    $('nName').textContent = best.name + (bp.est ? '(推定位置)' : '');
    $('nDist').textContent = fmt(bd) + (bd < ARRIVE_M ? '  到着' : '');
    if (bd < ARRIVE_M && me.acc <= 40 && !arrivalShown.has(best.id)) {
      arrivalShown.add(best.id);
      arriveId = best.id;
      $('arriveName').textContent = best.name + (bp.est ? '(推定位置。ずれている場合があります)' : '');
      $('arrive').hidden = false;
      beep();
      try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {}
    }
    const b = bearing(me, bp);
    const rot = heading == null ? b : (b - heading + 360) % 360;
    $('arrowSvg').style.transform = 'rotate(' + rot + 'deg)';
  }

  function renderAll() { renderMarkers(); render(); }

  function onPos(p) {
    me = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy };
    if (p.coords.heading != null && !isNaN(p.coords.heading) && (p.coords.speed || 0) > 0.5) heading = p.coords.heading;
    const ll = [me.lat, me.lng];
    if (!meMarker) {
      meMarker = L.marker(ll, { icon: L.divIcon({ className: '', html: '<div class="me"></div>', iconSize: [16, 16], iconAnchor: [8, 8] }), interactive: false, keyboard: false }).addTo(map);
      map.setView(ll, 17);
    } else meMarker.setLatLng(ll);
    say('現在地の精度: 約' + Math.round(me.acc) + ' m');
    // 一覧は押している最中に作り直さないよう、間隔をあけて更新する
    if (Date.now() - lastRender > 8000 && document.activeElement !== $('q')) render(); else renderNearest();
  }
  function onErr(e) {
    const m = { 1: '位置情報が許可されていません。設定 > Safari > 位置情報 で許可してください。', 2: '位置を取得できません。', 3: '位置の取得に時間がかかっています。' };
    say(m[e.code] || '位置情報エラー');
    $('nName').textContent = '現在地を取得できません';
  }
  function startGps() {
    if (!navigator.geolocation) { say('この端末は位置情報に対応していません。'); return; }
    navigator.geolocation.watchPosition(onPos, onErr, { enableHighAccuracy: true, maximumAge: 3000, timeout: 20000 });
  }

  $('locBtn').onclick = () => { if (me) map.setView([me.lat, me.lng], 17); else say('現在地を取得中です。'); };
  $('fAll').onclick = () => { filter = 'all'; render(); };
  $('fRoute').onclick = () => { filter = 'route'; render(); };
  $('q').oninput = () => render();
  $('addShown').onclick = () => { shownSpots().forEach((s) => { s.route = true; }); save(); renderAll(); say('表示中の地点を今日のルートに入れました。'); };
  $('clearRoute').onclick = () => { spots.forEach((s) => { s.route = false; }); save(); renderAll(); say('今日のルートを空にしました。'); };

  $('addBtn').onclick = () => {
    if (!me) { say('現在地を取得してから登録してください。'); return; }
    draft = { lat: me.lat, lng: me.lng, acc: me.acc };
    $('fPos').textContent = '位置 ' + draft.lat.toFixed(6) + ', ' + draft.lng.toFixed(6) + '(精度 約' + Math.round(draft.acc) + ' m)';
    $('fName').value = ''; $('fMemo').value = '';
    $('sheet').hidden = false; $('fName').focus();
  };
  $('cancelBtn').onclick = () => { $('sheet').hidden = true; };
  $('form').onsubmit = (e) => {
    e.preventDefault();
    const name = $('fName').value.trim();
    const same = spots.find((s) => s.name === name && !hasActual(s));  // 一覧や図面にある番号なら、その地点に位置を入れる
    let id;
    if (same) {
      id = same.id; same.lat = draft.lat; same.lng = draft.lng; same.acc = draft.acc; same.visited = true; same.at = Date.now();
      if ($('fMemo').value.trim()) same.memo = [same.memo, $('fMemo').value.trim()].filter(Boolean).join(' / ');
    } else {
      id = newId();
      spots.push({ id, name, memo: $('fMemo').value.trim(), lat: draft.lat, lng: draft.lng, acc: draft.acc, visited: true, at: Date.now() });
    }
    arrivalShown.add(id);
    const ok = save();
    $('sheet').hidden = true; renderAll(); pulseFresh(id); renderMarkers();
    map.setView([draft.lat, draft.lng], Math.max(map.getZoom(), 18));
    window.scrollTo({ top: 0, behavior: 'smooth' });
    if (ok) say('登録しました。この端末に保存済みです(全' + spots.length + '件)。');
  };

  $('arriveClose').onclick = () => { $('arrive').hidden = true; };
  $('arriveDone').onclick = () => {
    const s = spots.find((x) => x.id === arriveId);
    if (s) { s.visited = true; s.at = Date.now(); save(); renderAll(); pulseFresh(s.id); renderMarkers(); }
    $('arrive').hidden = true;
  };

  // 番号の一覧を貼り付けて追加(位置は現地で登録する)
  $('pasteBtn').onclick = () => { $('bulk').value = ''; $('sheet2').hidden = false; $('bulk').focus(); };
  $('cancel2').onclick = () => { $('sheet2').hidden = true; };
  $('form2').onsubmit = (e) => {
    e.preventDefault();
    const have = new Set(spots.map((s) => s.name));
    let added = 0, skipped = 0;
    $('bulk').value.split(/\r?\n/).slice(0, 500).forEach((line) => {
      const parts = line.trim().split(/[\s,\t]+/).filter(Boolean);
      if (!parts.length) return;
      let grp = '';
      if (/^[昼夜]/.test(parts[0]) && parts.length > 1) grp = parts.shift().slice(0, 4);
      const name = parts.shift().slice(0, 60);
      if (!name) return;
      if (have.has(name)) { skipped++; return; }
      have.add(name);
      const memo = [grp && grp + '間作業分', parts.length && '点検 ' + parts.join(' ').slice(0, 40)].filter(Boolean).join(' / ');
      spots.push({ id: newId() + added, name, memo, lat: null, lng: null, visited: false, at: null });
      added++;
    });
    save(); $('sheet2').hidden = true; renderAll();
    say(added + ' 件を追加しました' + (skipped ? '(重複 ' + skipped + ' 件は除外)' : '') + '。');
  };

  // 共有位置(全員の提出を集約したもの)を取り込む
  function applyMaster(list) {
    const byName = new Map(spots.map((x) => [x.name, x]));
    let upd = 0, add = 0;
    list.forEach((m) => {
      if (!m || !m.name || !isNum(m.lat) || !isNum(m.lng)) return;
      const hit = byName.get(String(m.name));
      if (hit) { hit.mlat = m.lat; hit.mlng = m.lng; hit.mn = m.n || 1; upd++; }
      else {
        const sp = { id: newId() + add, name: String(m.name).slice(0, 60), memo: '共有位置', lat: null, lng: null, mlat: m.lat, mlng: m.lng, mn: m.n || 1, visited: false, at: null };
        spots.push(sp); byName.set(sp.name, sp); add++;
      }
    });
    save(); renderAll(); say('共有位置を取り込みました(更新 ' + upd + ' 件、新規 ' + add + ' 件)。');
  }

  // 提出用の書き出し: 自分が現地で登録した位置だけを、担当名つきで出す
  async function submitExport() {
    const who = $('who').value.trim();
    if (!who) { say('先に「担当」を入力してください(提出した人を区別するため)。'); $('who').focus(); return; }
    const mine = spots.filter(hasActual);
    if (!mine.length) { say('提出できる位置の登録がありません。'); return; }
    const d = new Date(), pad = (n) => String(n).padStart(2, '0');
    const ymd = d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());
    const data = { format: 'manhole-upload-v1', date: ymd, who, spots: mine.map((x) => ({ name: x.name, lat: x.lat, lng: x.lng, acc: isNum(x.acc) ? Math.round(x.acc) : null, at: x.at || null })) };
    const fname = 'manhole-' + ymd + '-' + who + '.json';
    const text = JSON.stringify(data, null, 2);
    try {
      const file = new File([text], fname, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: fname });
        say(mine.length + ' 件を提出用に書き出しました。'); return;
      }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = fname; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    say(mine.length + ' 件を提出用に書き出しました(' + fname + ')。');
  }
  $('submitBtn').onclick = submitExport;
  try { $('who').value = localStorage.getItem('manhole.who') || ''; } catch (e) {}
  $('who').onchange = () => { try { localStorage.setItem('manhole.who', $('who').value.trim()); } catch (e) {} };
  $('arriveSel').value = String(ARRIVE_M);
  $('arriveSel').onchange = () => {
    ARRIVE_M = parseInt($('arriveSel').value, 10);
    try { localStorage.setItem('manhole.arriveM', String(ARRIVE_M)); } catch (e) {}
    say('到着を知らせる距離を ' + ARRIVE_M + ' m にしました。');
  };

  $('exportBtn').onclick = () => {
    const blob = new Blob([JSON.stringify(spots, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'manhole-backup.json'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  };
  $('importBtn').onclick = () => $('importFile').click();
  $('importFile').onchange = (e) => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const v = JSON.parse(r.result);
        if (v && v.format === 'manhole-master-v1' && Array.isArray(v.spots)) { applyMaster(v.spots); return; }
        if (!Array.isArray(v)) throw new Error();
        const ids = new Set(spots.map((s) => s.id));
        let n = 0;
        v.forEach((s) => {
          if (s && s.name && !ids.has(s.id)) {
            spots.push({ id: String(s.id || newId() + n), name: String(s.name), memo: String(s.memo || ''), lat: isNum(s.lat) ? s.lat : null, lng: isNum(s.lng) ? s.lng : null, acc: isNum(s.acc) ? s.acc : undefined, mlat: isNum(s.mlat) ? s.mlat : undefined, mlng: isNum(s.mlng) ? s.mlng : undefined, mn: isNum(s.mn) ? s.mn : undefined, visited: !!s.visited, at: s.at || null, route: !!s.route });
            n++;
          }
        });
        save(); renderAll(); say(n + ' 件を読み込みました。');
      } catch (err) { say('読み込めないファイルです。'); }
    };
    r.readAsText(f); e.target.value = '';
  };

  $('offlineBtn').onclick = saveOffline;
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

  initMap();
  renderAll();
  startGps();
})();
</script>
</body>
</html>
